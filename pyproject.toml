[project]
name = "trading-research"
version = "0.1.0"
description = "Research and backtesting environment for systematic trading"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "nautilus-trader>=1.231.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

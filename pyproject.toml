[project]
name = "trading-research"
version = "0.1.0"
description = "Research and backtesting environment for systematic trading"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "nautilus-trader>=1.231.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_research"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
